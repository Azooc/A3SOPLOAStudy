<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A3 SOP / LOA Study</title>
  <meta name="description" content="Practice Indy Area 3 SOPs and LOAs one aircraft at a time on a radar scope.">
  <meta name="theme-color" content="#050807">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23020705'/%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%2322c35f' stroke-width='1.6'/%3E%3Cpath d='M16 16 24 8' stroke='%237bff0f' stroke-width='2' stroke-linecap='round'/%3E%3Cpath d='M16 12 20 16 16 20 12 16z' fill='%23020705' stroke='%237bff0f' stroke-width='1.8'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=B612+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-view="build" data-tool="move" data-sweep="on">
  <header class="topbar" id="topbar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 34 34" aria-hidden="true">
        <rect x=".5" y=".5" width="33" height="33" rx="9" fill="#020705" stroke="#1b3a27"/>
        <circle cx="17" cy="17" r="11" fill="none" stroke="#22c35f" stroke-opacity=".6"/>
        <circle cx="17" cy="17" r="5.5" fill="none" stroke="#22c35f" stroke-opacity=".3"/>
        <path d="M17 17 25 9" stroke="#7bff0f" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M17 13.4 20.6 17 17 20.6 13.4 17Z" fill="#020705" stroke="#7bff0f" stroke-width="1.5"/>
      </svg>
      <div>
        <h1>A3 SOP / LOA Study</h1>
        <p class="sub">Indy Area 3 · one aircraft at a time</p>
      </div>
    </div>

    <div class="sector-pick" id="sector-pick" role="radiogroup" aria-label="Sector you're working"></div>

    <nav class="tabs" aria-label="Mode">
      <a href="#study" id="tab-study">Study</a>
      <a href="#build" id="tab-build">Build</a>
    </nav>
  </header>

  <main class="layout">
    <section class="scope-col">
      <div class="scope" id="scope">
        <div class="fx grid"></div>
        <div class="fx sweep"></div>
        <svg id="radar" viewBox="172 178 576 576" role="img" aria-label="Radar scope">
          <defs>
            <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="833" height="843">
              <feGaussianBlur stdDeviation="1.3" result="blur"/>
              <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>
          <g id="g-lines" filter="url(#glow)"></g>
          <g id="g-route" filter="url(#glow)"></g>
          <g id="g-track" filter="url(#glow)"></g>
          <g id="g-handles"></g>
        </svg>
        <div class="fx scan"></div>
        <div class="fx vignette"></div>
        <div class="scope-tag" id="scope-tag"></div>
        <button type="button" class="sweep-toggle" id="sweep-toggle" aria-pressed="true" title="Turn the radar sweep on or off">Sweep</button>
      </div>
      <p class="hint" id="hint"></p>
    </section>

    <aside class="panel">
      <!-- Study -->
      <section class="study" aria-label="Study">
        <div class="card">
          <div class="study-head">
            <span class="eyebrow" id="study-count"></span>
            <button type="button" class="toggle" id="btn-shuffle" aria-pressed="false">Shuffle</button>
          </div>

          <div class="study-body" id="study-body">
            <p class="q-text" id="q-text"></p>
            <label class="field">
              <span class="label">Your answer <em>optional</em></span>
              <textarea id="my-answer" rows="3" placeholder="Say it or type it, then check."></textarea>
            </label>
            <button type="button" class="btn primary wide" id="btn-reveal">Show answer <kbd>Space</kbd></button>
            <div class="answer" id="answer" hidden>
              <span class="eyebrow">Answer</span>
              <p id="a-text"></p>
            </div>
          </div>

          <div class="empty" id="study-empty" hidden>
            <p><strong>No <span id="empty-sector"></span> questions yet.</strong></p>
            <p>Make one in <a href="#build">Build</a>, hit Save, and send the output over to get it added.</p>
          </div>
        </div>

        <div class="study-nav">
          <button type="button" class="btn" id="btn-prev">← Prev</button>
          <button type="button" class="btn" id="btn-next">Next →</button>
        </div>
        <p class="keys"><kbd>Space</kbd> show answer · <kbd>←</kbd> <kbd>→</kbd> prev / next</p>
      </section>

      <!-- Build -->
      <section class="build" aria-label="Build a scenario">
        <div class="card">
          <div class="row-fit">
            <label class="field">
              <span class="label">Sector</span>
              <select id="f-sector"></select>
            </label>
            <label class="field" id="edit-wrap" hidden>
              <span class="label">Edit existing</span>
              <select id="f-edit"><option value="">New scenario</option></select>
            </label>
          </div>
          <div class="tools" role="radiogroup" aria-label="Tool">
            <button type="button" role="radio" data-tool="move" title="Drag things around (V)">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2.5v15M2.5 10h15M10 2.5 7.8 4.7M10 2.5l2.2 2.2M10 17.5l-2.2-2.2M10 17.5l2.2-2.2M2.5 10l2.2-2.2M2.5 10l2.2 2.2M17.5 10l-2.2-2.2M17.5 10l-2.2 2.2"/></svg>
              Move <kbd>V</kbd>
            </button>
            <button type="button" role="radio" data-tool="plane" title="Click to place the plane (P)">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7.5 8 11 11.5 7.5 15 4 11.5Z"/><path d="M10 9.5 16.5 3"/></svg>
              Plane <kbd>P</kbd>
            </button>
            <button type="button" role="radio" data-tool="route" title="Click to add route points (R)">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 16.5 8 9l5 3 4-8.5"/></svg>
              Route <kbd>R</kbd>
            </button>
          </div>
        </div>

        <div class="card">
          <h2>Aircraft</h2>
          <div class="db-fields">
            <label class="field span3">
              <span class="label">Callsign</span>
              <input id="f-callsign" class="mono" maxlength="10" autocomplete="off" spellcheck="false" placeholder="DAL2233">
            </label>
            <label class="field">
              <span class="label">Altitude</span>
              <input id="f-alt" class="mono" maxlength="10" autocomplete="off" spellcheck="false" placeholder="300C">
            </label>
            <label class="field">
              <span class="label">CID</span>
              <input id="f-cid" class="mono" maxlength="4" autocomplete="off" spellcheck="false" placeholder="012">
            </label>
            <label class="field">
              <span class="label">Speed</span>
              <input id="f-spd" class="mono" maxlength="4" autocomplete="off" spellcheck="false" placeholder="486">
            </label>
            <label class="field span3">
              <span class="label">Line 4</span>
              <input id="f-line4" class="mono" maxlength="16" autocomplete="off" spellcheck="false" placeholder="KCLT">
            </label>
          </div>
          <div class="row2">
            <label class="field">
              <span class="label">Heading</span>
              <span class="unit"><input id="f-hdg" type="number" min="0" max="359" step="1" inputmode="numeric"><span>°</span></span>
            </label>
            <label class="field">
              <span class="label">Vector <output id="o-vec"></output></span>
              <input id="f-vec" type="range" min="12" max="160" step="1">
            </label>
          </div>
        </div>

        <div class="card">
          <div class="card-head">
            <h2>Route</h2>
            <span class="muted" id="route-count"></span>
          </div>
          <div class="btn-row">
            <button type="button" class="btn" id="btn-route">Draw route</button>
            <button type="button" class="btn" id="btn-undo">Undo point</button>
            <button type="button" class="btn ghost" id="btn-route-clear">Clear</button>
          </div>
        </div>

        <div class="card">
          <h2>Question &amp; answer</h2>
          <label class="field">
            <span class="label">Question</span>
            <textarea id="f-question" rows="3"></textarea>
          </label>
          <label class="field">
            <span class="label">Answer</span>
            <textarea id="f-answer" rows="3"></textarea>
          </label>
        </div>

        <div class="card">
          <div class="btn-row">
            <button type="button" class="btn primary" id="btn-save">Save</button>
            <button type="button" class="btn" id="btn-copy">Copy</button>
            <button type="button" class="btn" id="btn-load" title="Load a saved scenario pasted into the box below">Load</button>
            <button type="button" class="btn ghost" id="btn-new">New</button>
          </div>
          <p class="msg" id="save-msg" role="status"></p>
          <textarea id="output" class="output" rows="9" spellcheck="false" aria-label="Saved scenario data"
            placeholder="Hit Save and this scenario's data shows up here.&#10;&#10;To edit a saved one, paste it here and hit Load."></textarea>
        </div>
      </section>
    </aside>
  </main>

  <script src="map.js"></script>
  <script src="scenarios.js"></script>
  <script src="app.js"></script>
</body>
</html>
